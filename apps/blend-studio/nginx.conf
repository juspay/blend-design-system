server {
    listen 8080;
    server_name _;
    port_in_redirect off;
    absolute_redirect off;

    root /usr/share/nginx/html;

    # Baseline security headers (audit #9), mirroring firebase.json.
    # NOTE: nginx drops inherited add_header directives in any location
    # that declares its own add_header, so locations with extra headers
    # re-declare the baseline below.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        return 301 /studio;
    }

    location /studio/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # OAuth uses a top-level popup plus postMessage, so no third-party
        # frame/script origins are needed; connect-src https: covers the
        # configurable backend API origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        try_files $uri $uri/ /studio/index.html;
    }

    location = /studio {
        return 301 /studio/;
    }

    location = /health {
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "public, immutable";
    }
}
