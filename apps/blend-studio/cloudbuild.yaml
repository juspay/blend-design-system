# =============================================================================
# Cloud Build pipeline — Blend Backend + Blend Studio image builds, Cloud Run
# deploys.
# -----------------------------------------------------------------------------
# Invoked by .github/workflows/deploy-staging.yml (and equivalents for
# staging/prod). Environment-specific names are controlled via substitutions;
# defaults below point at the staging service.
# =============================================================================

steps:
    # -------------------------------------------------------------------------
    # 1. Build backend image (multi-stage Dockerfile, BuildKit enabled)
    # -------------------------------------------------------------------------
    - id: 'build-backend'
      name: 'gcr.io/cloud-builders/docker'
      env:
          - 'DOCKER_BUILDKIT=1'
      args:
          - 'build'
          - '--pull'
          - '-t'
          - 'gcr.io/$PROJECT_ID/blend-backend:$BUILD_ID'
          - '-t'
          - 'gcr.io/$PROJECT_ID/blend-backend:latest'
          - '-f'
          - 'apps/backend/Dockerfile'
          - '.'

    - id: 'push-backend'
      name: 'gcr.io/cloud-builders/docker'
      waitFor: ['build-backend']
      args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/blend-backend']

    # -------------------------------------------------------------------------
    # 2. Build studio image in parallel (kept for environments that serve the
    #    studio from Cloud Run; Firebase Hosting deploys still work alongside)
    # -------------------------------------------------------------------------
    - id: 'build-studio'
      name: 'gcr.io/cloud-builders/docker'
      env:
          - 'DOCKER_BUILDKIT=1'
      args:
          - 'build'
          - '--pull'
          - '-t'
          - 'gcr.io/$PROJECT_ID/blend-studio:$BUILD_ID'
          - '-t'
          - 'gcr.io/$PROJECT_ID/blend-studio:latest'
          - '-f'
          - 'apps/blend-studio/Dockerfile'
          - '--build-arg'
          - 'VITE_FIREBASE_API_KEY=$_FIREBASE_API_KEY'
          - '--build-arg'
          - 'VITE_FIREBASE_AUTH_DOMAIN=$_FIREBASE_AUTH_DOMAIN'
          - '--build-arg'
          - 'VITE_FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID'
          - '--build-arg'
          - 'VITE_FIREBASE_STORAGE_BUCKET=$_FIREBASE_STORAGE_BUCKET'
          - '--build-arg'
          - 'VITE_FIREBASE_MESSAGING_SENDER_ID=$_FIREBASE_MESSAGING_SENDER_ID'
          - '--build-arg'
          - 'VITE_FIREBASE_APP_ID=$_FIREBASE_APP_ID'
          - '--build-arg'
          - 'VITE_FIREBASE_DATABASE_URL=$_FIREBASE_DATABASE_URL'
          - '--build-arg'
          - 'VITE_API_BASE_URL=$_API_BASE_URL'
          - '.'

    - id: 'push-studio'
      name: 'gcr.io/cloud-builders/docker'
      waitFor: ['build-studio']
      args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/blend-studio']

    # -------------------------------------------------------------------------
    # 3. Deploy backend to Cloud Run.
    #    `--set-env-vars` uses a custom `^|^` delimiter so values containing
    #    commas and '@' characters (e.g. DB URLs, service-account emails) are
    #    parsed safely.
    # -------------------------------------------------------------------------
    - id: 'deploy-backend'
      name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
      waitFor: ['push-backend']
      entrypoint: 'gcloud'
      args:
          - 'run'
          - 'deploy'
          - '$_BACKEND_SERVICE'
          - '--image=gcr.io/$PROJECT_ID/blend-backend:$BUILD_ID'
          - '--region=$_REGION'
          - '--platform=managed'
          - '--allow-unauthenticated'
          - '--add-cloudsql-instances=$_INSTANCE_CONNECTION_NAME'
          - '--set-env-vars=^@^NODE_ENV=production@FRONTEND_URL=$_FRONTEND_URL@STUDIO_URL=$_STUDIO_URL@GOOGLE_CLIENT_ID=$_GOOGLE_CLIENT_ID@GOOGLE_CLIENT_SECRET=$_GOOGLE_CLIENT_SECRET@GOOGLE_REDIRECT_URI=$_GOOGLE_REDIRECT_URI@FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID'
          - '--set-secrets=JWT_SECRET=blend-backend-jwt-secret:latest,JWT_REFRESH_SECRET=blend-backend-jwt-refresh-secret:latest,FIREBASE_PRIVATE_KEY=blend-backend-firebase-key:latest,DATABASE_URL=blend-backend-database-url:latest'
          - '--memory=512Mi'
          - '--cpu=1'
          - '--timeout=300'
          - '--min-instances=0'
          - '--max-instances=5'
          - '--concurrency=80'
          - '--quiet'

    # -------------------------------------------------------------------------
    # 4. Deploy studio to Cloud Run (optional — used when Firebase Hosting is
    #    not the sole frontend entrypoint).
    # -------------------------------------------------------------------------
    - id: 'deploy-studio'
      name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
      waitFor: ['push-studio']
      entrypoint: 'gcloud'
      args:
          - 'run'
          - 'deploy'
          - '$_STUDIO_SERVICE'
          - '--image=gcr.io/$PROJECT_ID/blend-studio:$BUILD_ID'
          - '--region=$_REGION'
          - '--platform=managed'
          - '--allow-unauthenticated'
          - '--memory=256Mi'
          - '--cpu=1'
          - '--timeout=60'
          - '--min-instances=0'
          - '--max-instances=3'
          - '--concurrency=200'
          - '--quiet'

# -----------------------------------------------------------------------------
# Artifacts published to GCR for both images.
# -----------------------------------------------------------------------------
images:
    - 'gcr.io/$PROJECT_ID/blend-backend:$BUILD_ID'
    - 'gcr.io/$PROJECT_ID/blend-backend:latest'
    - 'gcr.io/$PROJECT_ID/blend-studio:$BUILD_ID'
    - 'gcr.io/$PROJECT_ID/blend-studio:latest'

# -----------------------------------------------------------------------------
# Substitution defaults. Every sensitive value should be overridden from the
# invoking workflow / pipeline — the placeholders below only exist so `gcloud
# builds submit` succeeds in local dry-runs.
# -----------------------------------------------------------------------------
substitutions:
    _BACKEND_SERVICE: 'blend-backend'
    _STUDIO_SERVICE: 'blend-studio'
    _REGION: 'us-central1'
    _INSTANCE_CONNECTION_NAME: 'PROJECT_ID:REGION:INSTANCE'
    _FRONTEND_URL: 'https://example.invalid'
    _STUDIO_URL: ''
    _API_BASE_URL: 'https://api.example.invalid'
    _GOOGLE_CLIENT_ID: 'REPLACE_ME'
    _GOOGLE_CLIENT_SECRET: 'REPLACE_ME'
    _GOOGLE_REDIRECT_URI: 'https://api.example.invalid/api/auth/google/callback'
    _FIREBASE_API_KEY: 'REPLACE_ME'
    _FIREBASE_AUTH_DOMAIN: 'example.firebaseapp.com'
    _FIREBASE_PROJECT_ID: 'REPLACE_ME'
    _FIREBASE_STORAGE_BUCKET: 'example.appspot.com'
    _FIREBASE_MESSAGING_SENDER_ID: 'REPLACE_ME'
    _FIREBASE_APP_ID: 'REPLACE_ME'
    _FIREBASE_DATABASE_URL: 'https://example-default-rtdb.firebaseio.com'

options:
    logging: CLOUD_LOGGING_ONLY
    machineType: 'E2_HIGHCPU_8'
    dynamicSubstitutions: true

timeout: 1800s
