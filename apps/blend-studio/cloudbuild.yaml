steps:
    - name: 'gcr.io/cloud-builders/docker'
      id: 'build-backend'
      args:
          - 'build'
          - '-t'
          - 'gcr.io/$PROJECT_ID/blend-backend:$BUILD_ID'
          - '-t'
          - 'gcr.io/$PROJECT_ID/blend-backend:latest'
          - '-f'
          - 'apps/backend/Dockerfile'
          - '.'

    - name: 'gcr.io/cloud-builders/docker'
      id: 'push-backend'
      args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/blend-backend']
      waitFor: ['build-backend']

    - name: 'gcr.io/cloud-builders/docker'
      id: 'build-studio'
      args:
          - 'build'
          - '-t'
          - 'gcr.io/$PROJECT_ID/blend-studio:$BUILD_ID'
          - '-t'
          - 'gcr.io/$PROJECT_ID/blend-studio:latest'
          - '-f'
          - 'apps/blend-studio/Dockerfile'
          - '--build-arg'
          - 'VITE_FIREBASE_API_KEY=$_FIREBASE_API_KEY'
          - '--build-arg'
          - 'VITE_FIREBASE_AUTH_DOMAIN=$_FIREBASE_AUTH_DOMAIN'
          - '--build-arg'
          - 'VITE_FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID'
          - '--build-arg'
          - 'VITE_FIREBASE_STORAGE_BUCKET=$_FIREBASE_STORAGE_BUCKET'
          - '--build-arg'
          - 'VITE_FIREBASE_MESSAGING_SENDER_ID=$_FIREBASE_MESSAGING_SENDER_ID'
          - '--build-arg'
          - 'VITE_FIREBASE_APP_ID=$_FIREBASE_APP_ID'
          - '--build-arg'
          - 'VITE_FIREBASE_DATABASE_URL=$_FIREBASE_DATABASE_URL'
          - '--build-arg'
          - 'VITE_API_BASE_URL=$_API_BASE_URL'
          - '.'

    - name: 'gcr.io/cloud-builders/docker'
      id: 'push-studio'
      args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/blend-studio']
      waitFor: ['build-studio']

    - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
      id: 'deploy-backend'
      entrypoint: gcloud
      args:
          - 'run'
          - 'deploy'
          - '$_BACKEND_SERVICE'
          - '--image'
          - 'gcr.io/$PROJECT_ID/blend-backend:$BUILD_ID'
          - '--region'
          - 'us-central1'
          - '--platform'
          - 'managed'
          - '--no-allow-unauthenticated'
          - '--add-cloudsql-instances'
          - '$_INSTANCE_CONNECTION_NAME'
          - '--set-env-vars'
          - 'NODE_ENV=production,FRONTEND_URL=$_FRONTEND_URL,API_BASE_URL=$_API_BASE_URL,INSTANCE_CONNECTION_NAME=$_INSTANCE_CONNECTION_NAME,DATABASE_URL=$_DATABASE_URL,DATABASE_NAME=$_DATABASE_NAME,DATABASE_USER=$_DATABASE_USER,GOOGLE_CLIENT_ID=$_GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET=$_GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI=$_GOOGLE_REDIRECT_URI,FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID,FIREBASE_CLIENT_EMAIL=$_FIREBASE_CLIENT_EMAIL'
          - '--set-secrets'
          - 'DATABASE_PASSWORD=blend-backend-db-password:latest,JWT_SECRET=blend-backend-jwt-secret:latest,JWT_REFRESH_SECRET=blend-backend-jwt-refresh-secret:latest,FIREBASE_PRIVATE_KEY=blend-backend-firebase-key:latest'
          - '--memory'
          - '512Mi'
          - '--cpu'
          - '1'
          - '--timeout'
          - '300'
          - '--min-instances'
          - '0'
          - '--max-instances'
          - '5'
      waitFor: ['push-backend']

    - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
      id: 'deploy-studio'
      entrypoint: gcloud
      args:
          - 'run'
          - 'deploy'
          - '$_STUDIO_SERVICE'
          - '--image'
          - 'gcr.io/$PROJECT_ID/blend-studio:$BUILD_ID'
          - '--region'
          - 'us-central1'
          - '--platform'
          - 'managed'
          - '--allow-unauthenticated'
          - '--memory'
          - '256Mi'
          - '--cpu'
          - '1'
          - '--timeout'
          - '60'
          - '--min-instances'
          - '0'
          - '--max-instances'
          - '3'
      waitFor: ['push-studio']

images:
    - 'gcr.io/$PROJECT_ID/blend-backend:$BUILD_ID'
    - 'gcr.io/$PROJECT_ID/blend-backend:latest'
    - 'gcr.io/$PROJECT_ID/blend-studio:$BUILD_ID'
    - 'gcr.io/$PROJECT_ID/blend-studio:latest'

substitutions:
    _BACKEND_SERVICE: 'blend-backend'
    _STUDIO_SERVICE: 'blend-studio'
    _INSTANCE_CONNECTION_NAME: 'YOUR_PROJECT_ID:us-central1:blend-db'
    _DATABASE_URL: 'postgresql://admin@localhost:5432/blend_studio'
    _DATABASE_NAME: 'blend_studio'
    _DATABASE_USER: 'admin'
    _FRONTEND_URL: 'https://studio.blend.juspay.design'
    _API_BASE_URL: 'https://api.blend.juspay.design'
    _GOOGLE_CLIENT_ID: 'YOUR_GOOGLE_CLIENT_ID'
    _GOOGLE_CLIENT_SECRET: 'YOUR_GOOGLE_CLIENT_SECRET'
    _GOOGLE_REDIRECT_URI: 'https://api.blend.juspay.design/api/auth/google/callback'
    _FIREBASE_API_KEY: 'YOUR_FIREBASE_API_KEY'
    _FIREBASE_AUTH_DOMAIN: 'YOUR_PROJECT.firebaseapp.com'
    _FIREBASE_PROJECT_ID: 'YOUR_PROJECT_ID'
    _FIREBASE_STORAGE_BUCKET: 'YOUR_PROJECT.firebasestorage.app'
    _FIREBASE_MESSAGING_SENDER_ID: 'YOUR_SENDER_ID'
    _FIREBASE_APP_ID: 'YOUR_APP_ID'
    _FIREBASE_DATABASE_URL: 'https://YOUR_PROJECT-default-rtdb.firebaseio.com'
    _FIREBASE_CLIENT_EMAIL: 'blend-firebase@YOUR_PROJECT.iam.gserviceaccount.com'

options:
    logging: CLOUD_LOGGING_ONLY
