server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    location /studio/ {
        try_files $uri $uri/ /studio/index.html;
    }

    location /studio {
        return 301 /studio/;
    }

location = / {
        return 301 /studio;
    }

    location /studio {
        return 301 /studio/;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
